<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>小帳本 · 離線記帳</title>
  <meta name="description" content="不用上架 App Store 的記帳工具：加到主畫面即可離線使用，資料只存在你的手機裡。" />
  <meta name="theme-color" content="#0d9488" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <!-- iOS 加到主畫面 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="小帳本" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" href="icon-192.png" />
</head>
<body>

<!-- ══ 記帳 ══ -->
<section class="view" id="view-entry">
  <header class="bar">
    <h1 id="entry-title">記一筆</h1>
    <button class="ghost" id="btn-delete" hidden>刪除</button>
  </header>

  <div class="scroll">
    <div class="seg" id="seg-type">
      <button data-type="expense" class="on">支出</button>
      <button data-type="income">收入</button>
    </div>

    <button class="amount-box" id="amount-tap">
      <span class="hint">點一下輸入金額</span>
      <span class="val"><span class="cur" data-currency>NT$</span><span class="amount" id="amount">0</span></span>
    </button>

    <div class="cats" id="cats"></div>

    <div class="fields">
      <label class="field">
        <span>日期</span>
        <input type="date" id="date" />
      </label>
      <label class="field">
        <span>備註</span>
        <input type="text" id="note" placeholder="選填，例如：全家早餐" maxlength="40" />
      </label>
    </div>

    <button class="primary big" id="btn-save-form">儲存</button>
  </div>
</section>

<!-- ══ 明細 ══ -->
<section class="view" id="view-list" hidden>
  <header class="bar">
    <button class="ghost" data-month="-1">‹</button>
    <h1 id="list-month">2026-08</h1>
    <button class="ghost" data-month="1">›</button>
  </header>

  <div class="summary" id="list-summary"></div>

  <div class="scroll" id="list-body"></div>
</section>

<!-- ══ 統計 ══ -->
<section class="view" id="view-stats" hidden>
  <header class="bar">
    <button class="ghost" data-month="-1">‹</button>
    <h1 id="stats-month">2026-08</h1>
    <button class="ghost" data-month="1">›</button>
  </header>

  <div class="scroll">
    <div class="seg small" id="seg-stats">
      <button data-type="expense" class="on">支出</button>
      <button data-type="income">收入</button>
    </div>

    <div id="budget-box"></div>

    <div class="donut-wrap">
      <svg id="donut" viewBox="0 0 42 42" aria-hidden="true"></svg>
      <div class="donut-mid">
        <small id="donut-label">本月支出</small>
        <b id="donut-total">NT$0</b>
      </div>
    </div>

    <div id="rank"></div>

    <h2 class="sec">近 6 個月</h2>
    <div id="trend" class="trend"></div>
  </div>
</section>

<!-- ══ 設定 ══ -->
<section class="view" id="view-more" hidden>
  <header class="bar"><h1>設定</h1></header>
  <div class="scroll">

    <div class="card" id="install-card" hidden>
      <b>把 App 裝到手機</b>
      <p class="muted" id="install-text"></p>
      <button class="primary" id="btn-install" hidden>加到主畫面</button>
    </div>

    <h2 class="sec">偏好</h2>
    <div class="card row">
      <span>幣別符號</span>
      <input type="text" id="set-currency" maxlength="4" class="mini" />
    </div>
    <div class="card row">
      <span>每月預算</span>
      <input type="number" id="set-budget" min="0" step="100" placeholder="0 = 不設定" class="mini wide" />
    </div>

    <h2 class="sec">每月固定收支</h2>
    <div class="card">
      <p class="muted small">房租、訂閱、保費這類每月固定的帳，設定一次，之後每個月自動記上一筆（新增當下會先補記本月）。</p>
      <div id="rec-list"></div>
      <div class="recform">
        <div class="seg small" id="seg-rec-type">
          <button data-type="expense" class="on">支出</button>
          <button data-type="income">收入</button>
        </div>
        <div class="recrow">
          <input type="number" id="rec-amount" min="0" step="1" placeholder="金額" />
          <select id="rec-cat" aria-label="分類"></select>
          <select id="rec-day" aria-label="每月幾號"></select>
        </div>
        <div class="recrow">
          <input type="text" id="rec-note" maxlength="20" placeholder="備註，例如：房租" />
          <button class="primary" id="btn-add-rec">新增</button>
        </div>
      </div>
    </div>

    <h2 class="sec">自訂分類</h2>
    <div class="card">
      <div class="seg small" id="seg-cat-edit">
        <button data-type="expense" class="on">支出</button>
        <button data-type="income">收入</button>
      </div>
      <div id="cat-editor"></div>
      <div class="addcat">
        <input type="text" id="new-cat-icon" class="mini" maxlength="2" placeholder="🍎" />
        <input type="text" id="new-cat-name" maxlength="6" placeholder="分類名稱" />
        <button class="primary" id="btn-add-cat">新增</button>
      </div>
    </div>

    <h2 class="sec">資料</h2>
    <div class="card">
      <p class="muted">資料只存在這台裝置的瀏覽器，沒有伺服器、沒有帳號。換手機或清除瀏覽器資料前請先備份。</p>
      <div class="btns">
        <button id="btn-export-json">備份 JSON</button>
        <button id="btn-export-csv">匯出 CSV</button>
        <button id="btn-import">還原備份</button>
        <button class="danger" id="btn-clear">清除全部</button>
      </div>
      <input type="file" id="file-import" accept="application/json,.json" hidden />
    </div>

    <p class="muted center small" id="ver"></p>
  </div>
</section>

<nav class="tabs">
  <button data-view="entry" class="on"><i>✏️</i><span>記帳</span></button>
  <button data-view="list"><i>📒</i><span>明細</span></button>
  <button data-view="stats"><i>📊</i><span>統計</span></button>
  <button data-view="more"><i>⚙️</i><span>設定</span></button>
</nav>

<!-- 數字鍵盤抽屜：放在 body 層，才不會被 .view 的堆疊脈絡困住而被分頁列蓋住 -->
<div class="keypad" id="keypad">
  <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
  <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
  <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
  <button data-k=".">.</button><button data-k="0">0</button><button data-k="del" class="del">⌫</button>
  <button class="save" id="btn-save">儲存</button>
</div>

<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
