name = "ktmb-watch"
main = "src/index.js"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]

# 每 5 分钟查一次。要抢的可能只有 1 个位，20 分钟太慢。
# KTMB 是别人的站，别再调密。
[triggers]
crons = ["*/5 * * * *"]

[vars]
OKU_BASELINE = "4"          # 剩这个数以内视为 OKU 保留位，算没票
BOT_USERNAME = "ktmb_seat_watch_bot"  # /invite 拼深链用，填 BotFather 给的那个 @名字（不带 @）
OFFER_WINDOW_MINUTES = "3"  # queue 模式下，通知给一个人后等多久传给下一位
MAX_DAYS_AHEAD = "28"       # 最远能盯几天后。太远的日期 KTMB 还没开卖，却会一直占住线路额度
MAX_ROUTES = "12"           # 一轮最多跑几条线路
MAX_WATCHES_PER_USER = "3"  # 一个人最多盯几条。不限的话一个人就能占满 MAX_ROUTES
MAX_SUBREQUESTS = "50"      # Cloudflare 免费版一次执行的对外请求上限。查询与发通知共用这一份

# 建库：npx wrangler d1 create ktmb-watch
# 把输出的 database_id 贴到下面，再跑 migration（--local 和 --remote 各一次）
[[d1_databases]]
binding = "DB"
database_name = "ktmb-watch"
database_id = "bff49da8-e2c8-4a30-972a-7011743318e6"

# 用 `wrangler secret put` 设，别写进这个文件：
#   TELEGRAM_BOT_TOKEN       @BotFather 给的
#   TELEGRAM_WEBHOOK_SECRET  自己随便编一串，设 webhook 时要用同一串
