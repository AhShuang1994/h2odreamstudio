name = "moneybook-inbox"
main = "src/index.js"
compatibility_date = "2026-09-01"

# 每天清一次：30 天没被拉走的记录、180 天没被读过的收件箱
[triggers]
crons = ["17 3 * * *"]

# 请求日志一律关掉。封起来之前那一瞬间是明文，日志是唯一会把它留下来的地方
[observability]
enabled = false

[vars]
# 小帐本在哪些网址上跑。只有这些来源能开箱、拉取、确认、关闭（快捷指令投递不受影响）
ALLOWED_ORIGINS = "https://www.h2o-dreamer-studio.com,https://h2odreamstudio-next.pages.dev,http://localhost:3000,http://localhost:8099"
MAX_OPENS_PER_HOUR = "5"   # 同一个 IP 每小时最多开几个收件箱
MAX_ITEMS_PER_DAY = "300"  # 一个收件箱每天最多收几笔
MAX_PENDING = "500"        # 一个收件箱最多囤几笔没拉走的
MAX_BODY_BYTES = "1024"    # 一笔刷卡投递的请求体上限
MAX_MAIL_BYTES = "16384"   # 一封银行邮件投递的请求体上限（正文另外截到 8000 字）

# 建库：npx wrangler d1 create moneybook-inbox
# 把输出的 database_id 贴到下面，再跑 migration（--local 和 --remote 各一次）
[[d1_databases]]
binding = "DB"
database_name = "moneybook-inbox"
database_id = "b4c14362-757f-4211-b2e5-e65b58cad0b6"

# 用 `wrangler secret put QUOTA_SALT` 设一串随机字（选填）：
# 开箱限速存的是 IP 加盐后的哈希，有盐的话库里的哈希就反推不回 IP
