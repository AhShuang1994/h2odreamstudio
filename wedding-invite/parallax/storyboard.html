<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parallax Storyboard</title>
<style>
:root{
  --bg:#fbfaf8; --fg:#1a1a1a; --dim:#6b6b6b; --line:#e0ddd8;
  --card:#fff; --accent:#b4532a; --shadow:0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#16161a; --fg:#e8e6e3; --dim:#8f8d89; --line:#2e2e34;
    --card:#1e1e24; --accent:#e0794a; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
body{margin:0;padding:2rem 1.25rem 4rem;background:var(--bg);color:var(--fg);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}
.wrap{max-width:900px;margin:0 auto}
h1{font-size:1.5rem;margin:0 0 .25rem}
.logline{color:var(--dim);margin:0 0 .5rem}
.meta{font-size:.8rem;color:var(--dim);margin-bottom:2rem}
.meta b{color:var(--fg);font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:1.25rem;margin-bottom:2rem;box-shadow:var(--shadow);overflow-x:auto}
.panel h2{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);margin:0 0 1rem;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:1.1rem 1.25rem;box-shadow:var(--shadow)}
.card-head{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;margin-bottom:.75rem}
.card-id{font-weight:600;font-size:1.05rem}
.tag{font-size:.7rem;padding:.15rem .45rem;border-radius:4px;
  background:var(--line);color:var(--dim);white-space:nowrap}
.row{display:flex;gap:1.5rem;flex-wrap:wrap;align-items:flex-start}
.field{margin:.5rem 0;font-size:.85rem}
.field .k{color:var(--dim);font-size:.75rem;display:block;margin-bottom:.15rem}
.sw{display:flex;gap:.3rem;margin-top:.2rem}
.sw i{width:22px;height:22px;border-radius:4px;border:1px solid var(--line);display:block}
.devs{display:flex;gap:1rem;align-items:flex-end}
.dev{text-align:center}
.dev svg{display:block;border-radius:3px}
.dev span{font-size:.65rem;color:var(--dim)}
.arrow{display:flex;align-items:center;gap:.6rem;margin:.6rem 0;padding-left:1.25rem}
.arrow .bar{width:2px;height:26px;background:var(--line)}
.tt{font-size:.72rem;font-weight:600;padding:.2rem .5rem;border-radius:4px;
  background:var(--accent);color:#fff}
.tt.warn{background:#c0392b}
.note{font-size:.72rem;color:var(--dim)}
.budget{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title"></h1>
  <p class="logline" id="logline"></p>
  <div class="meta" id="meta"></div>

  <div class="panel">
    <h2>情绪弧线</h2>
    <div id="arc"></div>
  </div>

  <div id="sections"></div>
</div>

<script>
/* ============================================================
   只替换下面这一个对象。不要改动 HTML 与其余脚本。
   ============================================================ */
const DATA = /*__DATA__*/ {
  project: "Hui Huang & Mayyi — Garden Invitation",
  mode: "motif",
  logline: "你推开一扇爬满藤的木门,沿花径一路往里走,穿过花丛、绕过睡莲池、走过挂满花的拱门,尽头是摆好席位的婚礼现场——请柬的每一句话都在花间等你,让人一路慢下来、松下来。",
  engines: ["space-axis", "motif", "color-arc"],
  motif: "可穿过的门 / 拱(每道门槛是一次转场)",
  breakpoints: {
    desktop: { w: 1440, h: 900 },
    mobile:  { w: 430,  h: 932 }
  },
  sections: [
    {
      id: "s1-gate", act: "门槛·相邀", mood: 4, time: "08:30",
      palette: ["#F4EFE4", "#C7D4B8", "#6E8268"],
      motifBeat: "爬满藤蔓的木门虚掩,门缝透出园内的光——第一道门槛,门即是穿透进花园的洞。〔封面:Hui Huang & Mayyi · 2027.11.29〕",
      safe: { desktop: { x: [0.20, 0.80], y: [0.34, 0.60] },
              mobile:  { x: [0.10, 0.90], y: [0.30, 0.55] } },
      budget: { zh: { headline: 11, sub: 40 }, en: { headline: 22, sub: 120 } },
      transitionOut: { type: "zoom-through", horizonY: { desktop: 0.60, mobile: 0.56 } }
    },
    {
      id: "s2-path", act: "入径·welcome", mood: 5, time: "09:30",
      palette: ["#F4EFE4", "#C7D4B8", "#8FA07E"],
      motifBeat: "母题隐去。花径从门后向纵深展开,两侧花丛渐密,把视线引向远处。〔欢迎语 / 邀请引言〕",
      safe: { desktop: { x: [0.12, 0.62], y: [0.30, 0.52] },
              mobile:  { x: [0.08, 0.92], y: [0.10, 0.34] } },
      budget: { zh: { headline: 11, sub: 40 }, en: { headline: 22, sub: 120 } },
      transitionOut: { type: "continuous", horizonY: { desktop: 0.60, mobile: 0.56 } }
    },
    {
      id: "s3-pond", act: "池畔·相册", mood: 5, time: "11:00",
      palette: ["#C7D4B8", "#8FA07E", "#6E8268"],
      motifBeat: "母题隐去。花径绕过一方睡莲池,水面倒影盛开的花与天光——倒影承载回忆,引出相册。〔相册:我们的故事〕",
      safe: { desktop: { x: [0.10, 0.55], y: [0.28, 0.55] },
              mobile:  { x: [0.08, 0.92], y: [0.10, 0.38] } },
      budget: { zh: { headline: 11, sub: 40 }, en: { headline: 22, sub: 120 } },
      transitionOut: { type: "continuous", horizonY: { desktop: 0.60, mobile: 0.56 } }
    },
    {
      id: "s4-arch", act: "花拱·详情", mood: 6, time: "15:30",
      palette: ["#8FA07E", "#6E8268", "#E7C8B0"],
      motifBeat: "挂满花的木拱立在花径尽头——第二道门槛,可穿过。暖粉花色首次渗入,预告抵达。〔详情:2027.11.29 · 居銮 津津酒家〕",
      safe: { desktop: { x: [0.22, 0.78], y: [0.32, 0.58] },
              mobile:  { x: [0.08, 0.92], y: [0.12, 0.40] } },
      budget: { zh: { headline: 11, sub: 40 }, en: { headline: 22, sub: 120 } },
      transitionOut: { type: "zoom-through", horizonY: { desktop: 0.60, mobile: 0.56 } }
    },
    {
      id: "s5-venue", act: "抵达·RSVP", mood: 7, time: "17:00",
      palette: ["#6E8268", "#E7C8B0", "#EBD9B4"],
      motifBeat: "穿过花拱,拱棚下摆好的席位在暖金光里等你——母题化为环抱现场的花门,收在最暖处。〔RSVP + 导航〕",
      safe: { desktop: { x: [0.20, 0.80], y: [0.30, 0.58] },
              mobile:  { x: [0.08, 0.92], y: [0.14, 0.44] } },
      budget: { zh: { headline: 11, sub: 40 }, en: { headline: 22, sub: 120 } },
      transitionOut: null
    }
  ]
};
/* ===================== 以下不要改 ===================== */

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

$("title").textContent = DATA.project + " — Storyboard";
$("logline").textContent = DATA.logline || "";
$("meta").innerHTML =
  `模式 <b>${esc(DATA.mode)}</b> &nbsp;·&nbsp; 引擎 <b>${(DATA.engines||[]).map(esc).join(" + ")}</b>` +
  (DATA.motif ? ` &nbsp;·&nbsp; 母题 <b>${esc(DATA.motif)}</b>` : "") +
  ` &nbsp;·&nbsp; ${DATA.sections.length} 屏`;

/* ---- 情绪弧线 ---- */
(function arc() {
  const s = DATA.sections, W = 860, H = 170, P = 34;
  const step = s.length > 1 ? (W - P * 2) / (s.length - 1) : 0;
  const y = (m) => H - P - ((m - 1) / 9) * (H - P * 2);
  const pts = s.map((d, i) => [P + i * step, y(d.mood)]);
  const path = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const grid = [1, 5, 10].map(m =>
    `<line x1="${P}" x2="${W - P}" y1="${y(m)}" y2="${y(m)}" stroke="var(--line)" stroke-width="1"/>
     <text x="8" y="${y(m) + 4}" font-size="10" fill="var(--dim)">${m}</text>`).join("");
  const dots = pts.map((p, i) =>
    `<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="var(--accent)"/>
     <text x="${p[0]}" y="${p[1] - 12}" font-size="11" fill="var(--fg)" text-anchor="middle">${s[i].mood}</text>
     <text x="${p[0]}" y="${H - 10}" font-size="10" fill="var(--dim)" text-anchor="middle">${esc(s[i].id)}</text>`
  ).join("");
  $("arc").innerHTML =
    `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;min-width:520px">
       ${grid}
       <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5"
             stroke-linejoin="round" stroke-linecap="round"/>
       ${dots}
     </svg>`;
})();

/* ---- 设备安全区示意 ---- */
function devSVG(label, vp, safe) {
  if (!vp || !safe) return "";
  const H = 84, W = Math.max(20, Math.round(H * vp.w / vp.h));
  const rx = safe.x[0] * W, rw = (safe.x[1] - safe.x[0]) * W;
  const ry = safe.y[0] * H, rh = (safe.y[1] - safe.y[0]) * H;
  return `<div class="dev">
    <svg width="${W}" height="${H}">
      <rect x="0" y="0" width="${W}" height="${H}" fill="var(--line)"/>
      <rect x="${rx.toFixed(1)}" y="${ry.toFixed(1)}" width="${rw.toFixed(1)}" height="${rh.toFixed(1)}"
            fill="var(--accent)" opacity=".65"/>
    </svg><span>${label}</span></div>`;
}

/* ---- 分幕卡片 ---- */
const TT = { "continuous": "连续空间", "match-cut": "形状延续", "hard-cut": "硬切", "zoom-through": "穿透" };

$("sections").innerHTML = DATA.sections.map((d, i) => {
  const sw = (d.palette || []).map(c =>
    `<i style="background:${esc(c)}" title="${esc(c)}"></i>`).join("");
  const b = d.budget || {};
  const budget = (b.zh || b.en)
    ? `中 ${b.zh ? b.zh.headline + "/" + b.zh.sub : "—"} &nbsp; 英 ${b.en ? b.en.headline + "/" + b.en.sub : "—"}`
    : "未计算";

  const card = `<div class="card">
    <div class="card-head">
      <span class="card-id">${esc(d.id)}</span>
      ${d.act ? `<span class="tag">${esc(d.act)}</span>` : ""}
      ${d.time ? `<span class="tag">${esc(d.time)}</span>` : ""}
      <span class="tag">mood ${esc(d.mood)}</span>
    </div>
    <div class="row">
      <div style="flex:1;min-width:240px">
        <div class="field"><span class="k">母题 beat</span>${esc(d.motifBeat) || "<span class='note'>无</span>"}</div>
        <div class="field"><span class="k">palette</span><div class="sw">${sw}</div></div>
        <div class="field"><span class="k">文案预算 headline/sub</span>
          <span class="budget">${budget}</span></div>
      </div>
      <div class="field">
        <span class="k">文字安全区</span>
        <div class="devs">
          ${devSVG("desktop", DATA.breakpoints?.desktop, d.safe?.desktop)}
          ${devSVG("mobile", DATA.breakpoints?.mobile, d.safe?.mobile)}
        </div>
      </div>
    </div>
  </div>`;

  const t = d.transitionOut;
  if (!t || i === DATA.sections.length - 1) return card;
  const hy = t.horizonY || {};
  const next = DATA.sections[i + 1]?.transitionOut?.horizonY || {};
  // continuous 转场处视平线跳变检查
  let warn = "";
  if (t.type === "continuous" && hy.desktop != null && next.desktop != null &&
      Math.abs(hy.desktop - next.desktop) > 0.02) {
    warn = " · ⚠ 视平线跳变 " + Math.abs(hy.desktop - next.desktop).toFixed(3);
  }
  const arrow = `<div class="arrow">
    <div class="bar"></div>
    <span class="tt${warn ? " warn" : ""}">${esc(TT[t.type] || t.type)}</span>
    <span class="note">horizonY ${hy.desktop ?? "—"} / ${hy.mobile ?? "—"}${warn}</span>
  </div>`;
  return card + arrow;
}).join("");
</script>
</body>
</html>
