<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Hui Huang & Mayyi · 花园婚礼请柬</title>
  <meta name="description" content="Hui Huang & Mayyi 花园主题婚礼请柬 — 滚动视差原型" />
  <!-- private invitation: keep it out of every index (also enforced in _headers + robots.txt) -->
  <meta name="robots" content="noindex, nofollow, noarchive, noimageindex" />
  <meta name="googlebot" content="noindex, nofollow" />
  <link rel="stylesheet" href="style.css?v=9" />
</head>
<body>
  <!-- Fixed viewport stage: scenes stack back-to-front (s5 deepest, s1 on top) -->
  <div id="stage" aria-hidden="false">

    <!-- ===== S5 (venue) is the floor of the stack; the outro block scrolls over it ===== -->
    <section class="scene" id="s5" data-s="s5">
      <div class="sky" id="s5-sky"></div>
      <img class="layer" id="s5-L1" alt="" />
      <img class="layer" id="s5-L2" alt="" />
      <img class="layer" id="s5-L3" alt="" />
      <div class="copy copy-s5" id="s5-copy">
        <h2 class="headline">留个座位给你</h2>
        <p class="sub">告诉我们你会来,让这天更圆满</p>
      </div>
    </section>

    <!-- ===== S4 (flower arch) — second zoom-through; the opening is a real hole ===== -->
    <section class="scene" id="s4" data-s="s4">
      <div class="sky" id="s4-sky"></div>
      <img class="layer" id="s4-L1" alt="" />
      <img class="layer" id="s4-L2" alt="" />
      <img class="layer arch" id="s4-L3" alt="挂满花的木拱" />
      <div class="copy copy-s4" id="s4-copy">
        <h2 class="headline">花拱下相见</h2>
        <p class="sub">十一月廿九,穿过这道花拱,来入席</p>
        <p class="data">2027.11.29 · 居銮 津津酒家</p>
      </div>
    </section>

    <!-- ===== S3 (lily pond + gallery); the camera pans sideways here ===== -->
    <section class="scene" id="s3" data-s="s3">
      <div class="sky" id="s3-sky"></div>
      <img class="layer pan" id="s3-L2" alt="" />
      <div class="gallery" id="s3-gallery"></div>
      <img class="layer pan" id="s3-L3" alt="" />
      <div class="copy copy-s3" id="s3-copy">
        <h2 class="headline">我们的故事</h2>
        <p class="sub">像池水映花,一些片刻,想留给你看</p>
      </div>
    </section>

    <!-- ===== S2 (garden path) sits BEHIND s1, revealed on zoom-through ===== -->
    <section class="scene" id="s2" data-s="s2">
      <div class="sky" id="s2-sky"></div>
      <img class="layer" id="s2-L1" alt="" />
      <img class="layer" id="s2-L2" alt="" />
      <img class="layer" id="s2-L3" alt="" />
      <div class="copy copy-s2" id="s2-copy">
        <h2 class="headline">欢迎走进花园</h2>
        <p class="sub">放慢脚步,让花香陪你往里走</p>
      </div>
    </section>

    <!-- ===== S1 (vine gate) sits ON TOP; door zooms + fades to pass through ===== -->
    <section class="scene" id="s1" data-s="s1">
      <div class="sky" id="s1-sky"></div>
      <img class="layer" id="s1-L1" alt="" />
      <img class="layer" id="s1-L2" alt="" />
      <img class="layer door" id="s1-L3" alt="爬满藤蔓的花园木门" />
      <div class="glow" id="s1-glow"></div>
      <div class="copy copy-s1" id="s1-copy">
        <h1 class="headline">我们结婚了</h1>
        <p class="sub">诚邀你,走进这座为爱而开的花园</p>
        <p class="data">Hui Huang &amp; Mayyi · 2027.11.29</p>
      </div>
    </section>

  </div>

  <!-- scroll length driver; height set by JS from JSON scrollDistance -->
  <div id="scroll-space"></div>

  <!-- S5's UI rides in normal flow over the fixed stage, behind a cream scrim.
       A form driven by transforms inside the stage would be unusable on a phone. -->
  <main id="outro">
    <div class="scrim" aria-hidden="true"></div>
    <div class="outro-inner">

      <section class="card rsvp">
        <h3>回复出席</h3>
        <p class="card-note">2027 年 11 月 29 日 · 居銮 津津酒家</p>
        <form id="rsvp-form" novalidate>
          <label>称呼<input name="name" type="text" autocomplete="name" required placeholder="你的名字" /></label>
          <fieldset>
            <legend>能来吗?</legend>
            <label class="radio"><input type="radio" name="going" value="yes" checked /><span>会来</span></label>
            <label class="radio"><input type="radio" name="going" value="no" /><span>不能来</span></label>
          </fieldset>
          <label>同行人数<input name="guests" type="number" min="0" max="9" step="1" value="0" /></label>
          <label>想说的话 / 忌口<textarea name="note" rows="3" placeholder="选填"></textarea></label>
          <button type="submit">送出</button>
          <p class="form-msg" id="rsvp-msg" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="card map">
        <h3>怎么去</h3>
        <p class="card-note">居銮 津津酒家</p>
        <img src="assets/s5-map-card.webp" alt="津津酒家周边手绘地图" loading="lazy" width="1200" height="800" />
        <a class="map-btn" href="https://www.google.com/maps/search/?api=1&amp;query=%E6%B4%A5%E6%B4%A5%E9%85%92%E5%AE%B6%20%E5%B1%85%E9%8A%91"
           target="_blank" rel="noopener">用 Google 地图导航</a>
      </section>

      <p class="signoff">Hui Huang &amp; Mayyi · 2027.11.29</p>
    </div>
  </main>

  <div class="hint" id="hint" aria-hidden="true">向下滚动 ↓</div>

  <script src="script.js?v=9"></script>
</body>
</html>
